<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VLM Judge Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
img{max-width:100%}

/* Layout: a review console. Sticky top bar with three views; summary tables first, per-clip evidence (videos,
   judged frames, scores + rationales) below. Scores are colour-coded 1-5 so problems are visible at a glance. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --mut:#5d6573; --line:#dfe3e9; --accent:#2a5bd7; --accent-soft:#e7eefc;
  --s1:#b42318; --s2:#d9480f; --s3:#b08800; --s4:#4d8c1f; --s5:#1a7f45; --sx:#8a919c;
  --flag-bg:#fff4d6; --flag-fg:#8a5a00; --ctl:#7a8291;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --panel:#191d23; --ink:#e7eaef; --mut:#9aa3b1; --line:#2b313a; --accent:#82a7ff; --accent-soft:#1e2a44;
  --s1:#e5484d; --s2:#f76b15; --s3:#d6a400; --s4:#6fb13a; --s5:#30a46c; --sx:#6b7280;
  --flag-bg:#3a2e0d; --flag-fg:#f5c84b; --ctl:#7f8896; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#191d23; --ink:#e7eaef; --mut:#9aa3b1; --line:#2b313a; --accent:#82a7ff; --accent-soft:#1e2a44;
  --s1:#e5484d; --s2:#f76b15; --s3:#d6a400; --s4:#6fb13a; --s5:#30a46c; --sx:#6b7280;
  --flag-bg:#3a2e0d; --flag-fg:#f5c84b; --ctl:#7f8896; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .in{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-block:10px;max-width:1480px;margin:0 auto}
header b{font-size:15px;font-weight:600}
#meta{color:var(--mut);font:12px var(--mono);min-width:0;overflow-wrap:anywhere}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:var(--mut);text-decoration:none;padding:3px 10px;border-radius:6px;font-weight:500}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1480px;margin:0 auto;padding-block:18px 48px}
h2{font-size:17px;font-weight:600;margin:26px 0 6px;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
p{margin:6px 0}
.mut{color:var(--mut)}
.lede{max-width:72ch;color:var(--mut)}
.lede b{color:var(--ink);font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap}
th{font:500 12px var(--mono);color:var(--mut);background:var(--panel)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
tr:last-child td{border-bottom:0}
td.best{font-weight:600;color:var(--accent)}
tr.ctl td{color:var(--ctl)}
td.drop-ok{color:var(--s5);font-weight:600}
td.drop-bad{color:var(--s1);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.inputs{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.inputs figure{margin:0;min-width:0}
figcaption{font:12px var(--mono);color:var(--mut);margin-top:4px}
video{max-height:240px;max-width:100%;border-radius:4px;background:#000;display:block}
.ident{max-height:240px;max-width:100%;border-radius:4px;display:block}
.row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr)}}
.strip{overflow-x:auto;margin:6px 0}
.strip img{height:60px;max-width:none;display:block;border-radius:2px}
.sc{display:grid;grid-template-columns:minmax(0,170px) 30px minmax(0,1fr);gap:4px 10px;font-size:13px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.sc:first-child{border-top:0}
.sc .k{font:12px var(--mono);color:var(--mut);overflow-wrap:anywhere}
.pill{display:inline-block;min-width:24px;text-align:center;border-radius:4px;padding:0 4px;font:600 12px/18px var(--mono);color:#fff}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}.sx{background:var(--sx)}
.neg .k,.neg .why{color:var(--ctl)}
.flag{display:inline-block;background:var(--flag-bg);color:var(--flag-fg);border-radius:4px;padding:0 6px;font:500 11px/18px var(--mono);margin-left:6px}
details summary{cursor:pointer;color:var(--accent);margin-top:8px}
pre.rub{white-space:pre-wrap;font:12px/1.45 var(--mono);color:var(--mut);margin:6px 0;max-width:90ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font:12px var(--mono);color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--panel)}
.chips a.on{background:var(--accent-soft);border-color:var(--accent)}
select{font:inherit;padding:3px 6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.ci{display:grid;grid-template-columns:34px minmax(0,260px) minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding:8px 0;align-items:start}
.ci .strip img{height:44px}
@media (max-width:820px){.ci{grid-template-columns:34px minmax(0,1fr)}.ci>div:last-child{grid-column:1/-1}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:12px var(--mono);color:var(--mut);align-items:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="gut"><div class="in"><b>VLM Judge Pilot</b><span id="meta">loading…</span>
<nav aria-label="Views"><a href="#summary" id="n-summary">Summary</a><a href="#clips" id="n-clip">Per clip</a><a href="#criteria" id="n-crit">Per criterion</a></nav></div></header>
<main class="gut" id="app"><p class="mut">Loading results…</p></main>

<script>
let D;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=s=>`<span class="pill ${s?"s"+s:"sx"}">${s??"–"}</span>`;
const to100=m=>m==null?"–":((m-1)*25).toFixed(0);
const crits=()=>Object.values(D.calls).flat();
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sc=(src,m,k,c)=>src[m]?.[k]?.[c];
const colMean=(src,m,c,keys)=>mean(keys.map(k=>sc(src,m,k,c)?.score).filter(v=>v!=null));
const nOf=(src,m,c,keys)=>keys.filter(k=>sc(src,m,k,c)?.score!=null).length;
const hid=c=>c.replace(/_/g,"-");
const strip=(k,who,h)=>`<div class="strip"><img loading="lazy" src="media/${k}/strip_${who}.jpg" alt="16 frames the judge saw (${esc(who)})"${h?` style="height:${h}px"`:""}></div>`;
const CALLNAME={A:"Quality",B:"Compositing",C:"Identity",D:"Scene",E:"Motion",F:"Text"};
function flags(m,c,s,neg){const f=[];if(!neg&&m==="GT"&&s!=null&&s<=3)f.push("GT ≤ 3");if(neg&&s!=null&&s>=4)f.push("wrong input ≥ 4");return f.map(x=>`<span class="flag">${x}</span>`).join("")}

function summary(){
  const keys=D.clips.map(c=>c.key),C=crits();
  let h=`<h2>What this is</h2>
  <p class="lede">A pilot of a <b>VLM-as-judge evaluation</b> for video composition (scene + motion + identity → video). For ${keys.length} test clips, a vision-language model looks at 16 frames of each method's video, plus the given conditions, and scores 12 criteria from 1 to 5 using a written description of every level, with a short reason. Below, means are shown as 0–100 = (score − 1) × 25. <b>GT</b> is the real video (a sanity reference). Hover a column header for its rubric.</p>
  <p class="lede"><b>Wrong-input check:</b> for GT and HumanPrism-5B, the identity, scene and motion questions were asked a second time with the condition taken from a <i>different</i> clip. A judge that really compares the video with its condition must score those much lower.</p>
  <div class="legend">Score colours: ${[1,2,3,4,5].map(pill).join(" ")} <span>1 = fails · 5 = no problem</span></div>
  <h2>Mean score per criterion</h2><div class="scroll"><table><tr><th>Method</th>`;
  for(const [call,cs] of Object.entries(D.calls))for(const c of cs)h+=`<th title="${esc(D.rubrics[c])}">${c}</th>`;
  h+="<th>mean</th></tr>";
  const best={};for(const c of C){let b=-1;for(const m of D.methods){if(m==="GT")continue;const v=colMean(D.scores,m,c,keys);if(v!=null&&v>b)b=v}best[c]=b}
  for(const m of D.methods){const vals=C.map(c=>colMean(D.scores,m,c,keys));
    h+=`<tr class="${m==="GT"?"ctl":""}"><td>${esc(m)}</td>`;
    C.forEach((c,i)=>{const v=vals[i];h+=`<td class="${v!=null&&m!=="GT"&&Math.abs(v-best[c])<1e-9?"best":""}" title="n=${nOf(D.scores,m,c,keys)}">${to100(v)}</td>`});
    h+=`<td>${to100(mean(vals.filter(v=>v!=null)))}</td></tr>`}
  h+=`</table></div><p class="mut">Highlighted: best method per column (GT excluded). Gray row: real video.</p>
  <h2>Wrong-input check</h2><div class="scroll"><table><tr><th>Method</th><th>Criterion</th><th>Correct condition</th><th>Wrong condition</th><th>Drop</th><th>n</th></tr>`;
  for(const m of D.neg_methods)for(const call of D.neg_calls)for(const c of D.calls[call]){
    const a=colMean(D.scores,m,c,keys),b=colMean(D.neg,m,c,keys),d=a!=null&&b!=null?(a-b)*25:null;
    h+=`<tr><td>${esc(m)}</td><td>${c}</td><td>${to100(a)}</td><td>${to100(b)}</td><td class="${d==null?"":d>=25?"drop-ok":"drop-bad"}">${d==null?"–":d.toFixed(0)}</td><td>${nOf(D.neg,m,c,keys)}</td></tr>`}
  h+=`</table></div><h2>Clips</h2><div class="chips">${D.clips.map(c=>`<a href="#clip-${c.key}">${c.key}</a>`).join("")}</div>`;
  return h;
}

function clipPage(k){
  const c=D.clips.find(x=>x.key===k)||D.clips[0];k=c.key;
  let h=`<div class="chips" style="margin-bottom:10px">${D.clips.map(x=>`<a href="#clip-${x.key}" class="${x.key===k?"on":""}">${x.key}</a>`).join("")}</div>
  <div class="card"><h3>Inputs · clip ${k}</h3><p><b>Caption:</b> ${esc(c.caption)}</p><div class="inputs">
  <figure><video src="media/${k}/target.mp4" muted loop autoplay playsinline class="sync"></video><figcaption>Real target video</figcaption></figure>
  <figure><video src="media/${k}/scene.mp4" muted loop autoplay playsinline class="sync"></video><figcaption>Given scene</figcaption></figure>
  <figure><video src="media/${k}/motion.mp4" muted loop autoplay playsinline class="sync"></video><figcaption>Given motion (mesh render)</figcaption></figure>
  <figure><img class="ident" src="media/${k}/identity.jpg" alt="Given identity: front, back and side views"><figcaption>Given identity (front · back · side)</figcaption></figure></div>
  <details><summary>Frames the judge saw for scene and motion</summary>${strip(k,"scene")}${strip(k,"motion")}</details>
  <p class="mut">Wrong-input rows below use the identity / scene / motion of clip <a href="#clip-${c.neg_clip}">${c.neg_clip}</a>.</p></div>`;
  for(const m of D.methods){
    h+=`<div class="card"><h3>${esc(m)}${m==="GT"?' <span class="mut">(real video)</span>':""}</h3><div class="row"><div><video src="media/${k}/${m}.mp4" muted loop autoplay playsinline class="sync"></video>${strip(k,m)}</div><div>`;
    for(const [call,cs] of Object.entries(D.calls))for(const cr of cs){
      const s=sc(D.scores,m,k,cr);
      h+=`<div class="sc"><div class="k" title="${esc(D.rubrics[cr])}">${CALLNAME[call]} · ${cr}</div><div>${pill(s?.score)}</div><div class="why">${esc(s?.rationale||"")}${flags(m,cr,s?.score,false)}</div></div>`;
      const ng=sc(D.neg,m,k,cr);
      if(ng)h+=`<div class="sc neg"><div class="k">↳ wrong input</div><div>${pill(ng.score)}</div><div class="why">${esc(ng.rationale)}${flags(m,cr,ng.score,true)}</div></div>`;
    }
    h+="</div></div></div>";
  }
  return h;
}

function critPage(cr){
  const C=crits();cr=C.includes(cr)?cr:C[0];
  let h=`<p><label for="csel">Criterion</label> <select id="csel">${C.map(c=>`<option value="${c}" ${c===cr?"selected":""}>${c}</option>`).join("")}</select> <span class="mut">all clips × methods, lowest score first</span></p>
  <details open><summary>Rubric</summary><pre class="rub">${esc(D.rubrics[cr])}</pre></details>`;
  const items=[];for(const m of D.methods)for(const c of D.clips){const s=sc(D.scores,m,c.key,cr);if(s)items.push({m,k:c.key,s})}
  items.sort((a,b)=>a.s.score-b.s.score||a.m.localeCompare(b.m));
  for(const it of items)h+=`<div class="ci"><div>${pill(it.s.score)}</div><div><a href="#clip-${it.k}">${it.k}</a> · ${esc(it.m)}${flags(it.m,cr,it.s.score,false)}<br><span class="mut">${esc(it.s.rationale)}</span></div><div>${strip(it.k,it.m,44)}</div></div>`;
  return h;
}

function syncVideos(){const v=[...document.querySelectorAll("video.sync")];if(!v.length)return;const clock=v[0];
  clock.addEventListener("timeupdate",()=>{for(const x of v.slice(1))if(Math.abs(x.currentTime-clock.currentTime)>0.15)x.currentTime=clock.currentTime})}

function route(){
  const h=location.hash.slice(1)||"summary";let page="summary",arg=null;
  if(h==="clips"){page="clip"}else if(h.startsWith("clip-")){page="clip";arg=h.slice(5)}
  else if(h==="criteria"){page="crit"}else if(h.startsWith("crit-")){page="crit";arg=crits().find(c=>hid(c)===h.slice(5))}
  for(const p of ["summary","clip","crit"])$("#n-"+p).classList.toggle("on",page===p);
  $("#app").innerHTML=page==="clip"?clipPage(arg):page==="crit"?critPage(arg):summary();
  if(page==="crit")$("#csel").onchange=e=>{location.hash="crit-"+hid(e.target.value)};
  syncVideos();window.scrollTo(0,0);
}
fetch("data.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{D=d;const m=D.meta||{};
  $("#meta").textContent=`${D.clips.length} clips · ${D.methods.length} rows · judge ${m.model||"?"} · prompts ${m.prompt_version||""}`;
  window.addEventListener("hashchange",route);route()})
  .catch(e=>{$("#app").innerHTML=`<p>Could not load the results file (data.json): ${esc(e.message)}. Reload the page to try again.</p>`});
</script>

</body>
</html>
